apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-api
  namespace: books
  labels:
    app: books-api
spec:
  # 2 реплики: Service балансирует между ними, при падении пода трафик идёт на вторую.
  # Число реплик задаётся здесь, а не вручную: повторный apply вернёт значение из манифеста.
  replicas: 2
  selector:
    matchLabels:
      app: books-api
  template:
    metadata:
      labels:
        app: books-api
    spec:
      containers:
        - name: api
          image: books-api:1.0 # собирается внутри minikube: minikube image build (см. deploy.sh)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: books-db
                  key: DATABASE_URL
            - name: LOG_LEVEL
              value: INFO
          startupProbe: # сервис ждёт БД до 60 с — не убиваем его liveness-проверкой раньше времени
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: books-api
  namespace: books
spec:
  type: NodePort
  selector:
    app: books-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
